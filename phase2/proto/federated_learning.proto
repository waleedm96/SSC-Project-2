syntax = "proto3";

package sscfederated;

option java_package = "com.ssc.federated";
option java_multiple_files = true;

// Push model: every participant runs its own small gRPC server (ParticipantService).
// It registers its address with the coordinator, and the coordinator sends it the
// training tasks of each round.


// Runs in the coordinator (Python).
service CoordinatorService {

  // ---- called by participants (Node.js, Python, Java)
  rpc RegisterParticipant (RegisterParticipantRequest) returns (RegisterParticipantReply);

  // ---- called by the management client (Python CLI)
  rpc ListParticipants    (ListParticipantsRequest)    returns (ListParticipantsReply);
  rpc CreateJob           (CreateJobRequest)           returns (CreateJobReply);
  rpc StartTraining       (StartTrainingRequest)       returns (StartTrainingReply);
  rpc GetTrainingStatus   (TrainingStatusRequest)      returns (TrainingJob);
}

// Runs in every participant.
service ParticipantService {
  // ---- called by the coordinator: train one round on the local data and return the result
  rpc SendTrainingTask    (TrainingTaskRequest)        returns (TrainingResult);
}


enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  CREATED   = 1;
  RUNNING   = 2;
  COMPLETED = 3;
  FAILED    = 4;
}

message TrainingConfig {
  int32  num_rounds     = 1;
  double initial_weight = 2;
}

message TrainingTask {
  string         job_id        = 1;
  int32          round         = 2;
  double         global_weight = 3;
  TrainingConfig config        = 4;
}

message TrainingResult {
  string job_id         = 1;
  string participant_id = 2;   // the participant's address (participant_ip_addr)
  int32  round          = 3;
  double local_weight   = 4;
  int32  num_samples    = 5;
}

message TrainingJob {
  string                  job_id          = 1;
  TrainingConfig          config          = 2;
  repeated string         participant_ids = 3;   // participant addresses
  JobStatus               status          = 4;
  int32                   current_round   = 5;
  double                  global_weight   = 6;
  repeated TrainingResult results         = 7;
}

message ParticipantInfo {
  string participant_ip_addr = 1;   // host:port of the participant's ParticipantService
  string name                = 2;
}

// RegisterParticipant
message RegisterParticipantRequest {
  string participant_ip_addr = 1;   // where the coordinator can reach this participant
  string name                = 2;
}
message RegisterParticipantReply {
  string participant_ip_addr = 1;
}

// SendTrainingTask
message TrainingTaskRequest {
  TrainingTask task = 1;
}

// ListParticipants
message ListParticipantsRequest {}
message ListParticipantsReply {
  repeated ParticipantInfo participants = 1;
}

// CreateJob
message CreateJobRequest {
  TrainingConfig config = 1;
}
message CreateJobReply {
  string job_id = 1;
}

// StartTraining
message StartTrainingRequest {
  string job_id = 1;
}
message StartTrainingReply {
  bool   started = 1;
  string message = 2;
}

// GetTrainingStatus
message TrainingStatusRequest {
  string job_id = 1;
}
