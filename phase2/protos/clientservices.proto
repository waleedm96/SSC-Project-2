syntax = "proto3";

service TrainingService {

    rpc startTraining (stream TrainingTask) returns (stream TrainingResult) {}
}

message TrainingTask {
    string job_id = 1;
    int32 round = 2;
    float global_weight = 3;
    int32 num_rounds = 4;
    float initial_weight = 5;
}

message TrainingResult {
    string job_id = 1;
    string participant_id = 2;
    int32 round = 3;
    float local_weight = 4;
    int32 num_samples = 5;
}



